<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Rating Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 700px;
        }

        h1 {
            color: #333;
        }

        p {
            margin: 12px 0;
        }

        .button {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 15px;
            margin-right: 10px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete {
            background-color: #dc3545;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Staff Rating Details</h1>

    <p>
        <strong>Name:</strong>
        <span th:text="${rating.name}"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span th:text="${rating.email}"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span th:text="${displayTitle}"></span>
    </p>

    <p>
        <strong>Clarity:</strong>
        <span th:text="${rating.clarity}"></span>
    </p>

    <p>
        <strong>Niceness:</strong>
        <span th:text="${rating.niceness}"></span>
    </p>

    <p>
        <strong>Knowledgeable Score:</strong>
        <span th:text="${rating.knowledgeableScore}"></span>
    </p>

    <p>
        <strong>Comment:</strong>
        <span th:text="${rating.comment}"></span>
    </p>

    <a class="button"
       th:href="@{/ratings/{id}/edit(id=${rating.id})}">
        Edit
    </a>

    <form th:action="@{/ratings/{id}/delete(id=${rating.id})}"
          method="post"
          style="display:inline;"
          onsubmit="return confirm('Are you sure you want to delete this rating?');">

        <button type="submit" class="button delete">
            Delete
        </button>

    </form>

    <br>

    <a th:href="@{/}" class="button">
        Back to Home
    </a>

</div>

</body>
</html>
